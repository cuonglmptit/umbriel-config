[output.eDP-1]
enabled = true
position = [0, 0]
scale = 1.0
transform = "normal"
focus_at_startup = true
workspace_axis = "horizontal"
# mode = "1920x1080@144"

# min_workspaces = 1
workspaces = 10


[keybinds]
"Ctrl+Alt+Up" = "spawn wlr-randr --output eDP-1 --transform normal"
"Ctrl+Alt+Left" = "spawn wlr-randr --output eDP-1 --transform 90"
"Ctrl+Alt+Down" = "spawn wlr-randr --output eDP-1 --transform 180"
"Ctrl+Alt+Right" = "spawn wlr-randr --output eDP-1 --transform 270"
